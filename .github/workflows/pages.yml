# Rebuilds the market data and publishes web/ to GitHub Pages.
# Runs hourly through the EGX day (10:05-15:05 Cairo, Sun-Thu), on every push to main,
# and on demand (Actions tab > Run workflow).
name: Build data and publish

on:
  schedule:
    # Cron is UTC only and Cairo is UTC+3 in summer, UTC+2 in winter, so this covers both
    # (07:05-13:05 UTC) and the gate job below skips whatever falls outside 10:00-15:59 Cairo.
    # Five past the hour because GitHub delays on-the-hour schedules most under load.
    - cron: "5 7-13 * * 0-4"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          day=$(TZ=Africa/Cairo date +%u)    # 1 = Monday ... 5 = Friday, 6 = Saturday, 7 = Sunday
          hour=$(TZ=Africa/Cairo date +%-H)
          if [ "$EVENT" != "schedule" ]; then run=true
          elif [ "$day" -eq 5 ] || [ "$day" -eq 6 ] || [ "$hour" -lt 10 ] || [ "$hour" -gt 15 ]; then run=false
          else run=true; fi
          echo "Cairo time $(TZ=Africa/Cairo date '+%a %H:%M'), $EVENT -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Last run's candles: if a symbol fails to download, the build reuses its previous data.
      - uses: actions/cache@v6
        with:
          path: web/data
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Build market data
        run: python egx_data.py

      # Pages lets browsers keep files for 10 minutes. Per-commit asset URLs make a fresh
      # index.html always load its matching code instead of a cached older app.js.
      - name: Version asset URLs
        run: sed -i -E 's/(href="style\.css|src="(charts|app)\.js)"/\1?v=${{ github.sha }}"/g' web/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
